name: Live Stream Bot

on:
  workflow_dispatch: # GitHub එකෙන් manual ස්ටාර්ට් කරන්න පුළුවන් වෙන්න

jobs:
  stream:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        pip install pytchat websockets
        sudo apt-get update
        sudo apt-get install -y xvfb ffmpeg chromium-browser

    - name: Start Services and Stream
      run: |
        # 1. HTML ෆයිල් එක තියෙන තැන (Localhost:8000) පුංචි වෙබ් සර්වර් එකක් ස්ටාර්ට් කරනවා
        python -m http.server 8000 &
        
        # 2. ඔයාගේ පයිතන් චැට් සර්වර් එක බැක්ග්‍රවුන්ඩ් එකේ රන් කරනවා
        python chat_vote_server.py --video-id ${{ secrets.YOUTUBE_VIDEO_ID }} &
        
        # 3. වර්චුවල් ඩිස්ප්ලේ එකක් හදනවා (:99 කියන screen id එකෙන්)
        Xvfb :99 -screen 0 1080x1920x24 &
        export DISPLAY=:99
        
        # පොඩි විරාමයක් දෙනවා සර්වර්ස් ටික active වෙනකන්
        sleep 3
        
        # 4. වර්චුවල් මොනිටරය ඇතුළේ බ්‍රවුසර් එකෙන් අපේ index.html එක open කරනවා
        chromium-browser --no-sandbox --window-size=1080,1920 http://localhost:8000/index.html &
        
        # 5. FFmpeg එකෙන් ඒ වර්චුවල් ස්ක්‍රීන් එක කැප්චර් කරලා YouTube එකට තල්ලු කරනවා
        ffmpeg -f x11grab -video_size 1080x1920 -i :99.0+0,0 -f flv rtmps://a.rtmp.youtube.com/live2/${{ secrets.YOUTUBE_STREAM_KEY }}
