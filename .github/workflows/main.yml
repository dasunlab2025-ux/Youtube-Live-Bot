name: Daily YouTube Vertical Live

on:
  schedule:
    # ලංකාවේ වෙලාවෙන් දවල් 1:30 ට (UTC 08:00)
    - cron: '0 8 * * *' 
  workflow_dispatch: 

jobs:
  live-stream:
    runs-on: ubuntu-latest
    steps:
      - name: Install FFmpeg & gdown
        run: |
          sudo apt update
          sudo apt install ffmpeg -y
          pip install gdown

      - name: Download Video from Google Drive
        run: |
          # ඔබ ලබා දුන් ලින්ක් එකේ ID එක මෙතැනට ඇතුළත් කර ඇත
          gdown 1sCa7kmo5Z9uLxiEG2j1HlKonBdOFgAUC -O video.mp4

      - name: Start Streaming to YouTube (1 Hour & 12 Minutes)
        env:
          STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        run: |
          # -t 4320 මගින් පැය 1 යි විනාඩි 12 ක කාලයක් ලබා දෙයි
          ffmpeg -re -stream_loop -1 -i video.mp4 -c:v copy -c:a aac -t 4320 -f flv rtmp://a.rtmp.youtube.com/live2/$STREAM_KEY
